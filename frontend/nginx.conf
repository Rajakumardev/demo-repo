# nginx configuration for the Expense Manager SPA.
# Serves the built assets and proxies the API to the backend service.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-lived caching for hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Forward API calls to the Express service (same-origin for the browser,
    # so the httpOnly refresh cookie flows without any CORS configuration).
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # SPA fallback: every unknown path resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
